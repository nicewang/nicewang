    <title>Xiaonan (Nice) Wang's Proflie - Laguna Beach & Rigi Style</title>
    <style>
        /* Base page styling with dark background to make the light card pop */
        body {
            margin: 0;
            padding: 0;
            /* Gradient from Night Sky Black to Deep Sea Blue (Strictly NO green) */
            background: linear-gradient(180deg, #030712 0%, #0f172a 40%, #1e3a8a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Ambient shimmer and glow effects */
        .glow-system {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
        }

        .shimmer-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.25;
            animation: slowFloat 15s infinite ease-in-out alternate;
        }

        .orb-blue { width: 600px; height: 600px; background: #0ea5e9; top: -10%; left: 10%; }
        /* Pure deep ocean blue orb */
        .orb-ocean { width: 500px; height: 500px; background: #2563eb; bottom: 10%; right: 10%; animation-delay: -5s; }
        .orb-indigo { width: 700px; height: 700px; background: #4338ca; top: 40%; left: 30%; animation-delay: -10s; }

        @keyframes slowFloat {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(40px, 60px) scale(1.15); }
        }

        /* Star Field Implementation */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .star {
            fill: #FFFFFF;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.15; transform: scale(0.8); }
            50% { opacity: 0.9; transform: scale(1.2); }
        }

        /* Container ensuring proper scaling on different screens */
        .profile-wrapper {
            width: 100%;
            max-width: 1050px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        /* Responsive SVG with soft shadow suited for dark backgrounds */
        .profile-wrapper svg {
            width: 100%;
            height: auto;
            max-height: 90vh;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
            display: block;
        }

        /* Entrance transition animation */
        @keyframes pageFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .profile-wrapper {
            animation: pageFadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>

                <style>
                    /* <![CDATA[ */
                    :root {
                        --text-main: #1E293B; 
                        --text-muted: #475569;
                        --text-dim: #64748B;
                        --accent-blue: #0284C7;
                        --accent-teal: #0891B2;
                        --accent-cyan: #06B6D4;
                        --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
                        --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
                    }

                    text { font-family: var(--font-family); fill: var(--text-main); }
                    a { cursor: pointer; }
                    a:hover .link-text { fill: #0369A1; text-decoration: underline; }

                    .title-hi { font-size: 28px; font-weight: 800; fill: url(#text-grad); }
                    .quote { font-size: 15px; font-style: italic; fill: var(--text-muted); text-anchor: middle; }
                    .section-title { font-size: 18px; font-weight: 700; fill: var(--text-main); }
                    
                    .bullet { font-size: 14.5px; fill: var(--text-muted); }
                    .sub-bullet { font-size: 14px; fill: var(--text-dim); }
                    
                    .bold-text { font-weight: 700; fill: var(--text-main); }
                    .small-text { font-size: 12.5px; fill: var(--text-dim); }
                    
                    .link-text { fill: var(--accent-blue); font-weight: 600; text-decoration: underline; transition: fill 0.3s; }
                    .code-text { fill: var(--accent-teal); font-family: var(--font-mono); font-size: 13.5px; }

                    .tag-bg { fill: #ECFEFF; stroke: #A5F3FC; stroke-width: 1.5; }
                    .tag-text { font-size: 12.5px; font-weight: 600; fill: var(--accent-teal); text-anchor: middle; }

                    /* Core Keyframe Animations */
                    @keyframes fadeIn { 0% { opacity: 0; transform: translateY(15px); } 100% { opacity: 1; transform: translateY(0); } }
                    @keyframes wave { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-20deg); } 75% { transform: rotate(20deg); } }
                    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
                    @keyframes leap-arc {
                        0% { transform: translate(-40px, 150px) rotate(-35deg); opacity: 0; }
                        10% { opacity: 1; transform: translate(50px, 20px) rotate(-20deg); }
