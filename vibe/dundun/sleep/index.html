<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>熟睡的小宝宝</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f8f9fa;
        }
        .svg-container {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border-radius: 20px;
            background-color: #ffffff;
            /* 适配响应式大小 */
            width: 90%;
            max-width: 450px;
            aspect-ratio: 1 / 1;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        svg {
            width: 100%;
            height: 100%;
        }
        /* SVG 内部的样式 */
        .zzz {
            font-family: "Comic Sans MS", cursive, sans-serif;
            font-weight: bold;
            fill: #a8dadc;
        }
        @keyframes float {
            0% { opacity: 0; transform: translate(0, 0) scale(0.5); }
            30% { opacity: 1; }
            100% { opacity: 0; transform: translate(-30px, -50px) scale(1.5); }
        }
        @keyframes breathe {
            0%, 100% { transform: scaleY(1) translateY(0); }
            50% { transform: scaleY(1.03) translateY(-4px); }
        }
        .z1 { animation: float 3s infinite; }
        .z2 { animation: float 3s infinite 1s; }
        .z3 { animation: float 3s infinite 2s; }
        
        /* 衣服和身体的呼吸起伏 */
        .chest { 
            animation: breathe 3s infinite ease-in-out; 
            transform-origin: bottom center; 
        }

        /* 音乐控制按钮样式 */
        .music-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: 2px solid #fcd5ce;
            color: #e56b6f;
            font-size: 22px;
            user-select: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            z-index: 10; /* 确保按钮在最上层 */
        }
        .music-btn:hover {
            transform: scale(1.1);
            background: #ffffff;
        }
        .music-btn.playing {
            background: #ffb5a7;
            border-color: #ffb5a7;
            color: #ffffff;
            /* 播放时按钮自带轻微呼吸感 */
            animation: breathe 3s infinite ease-in-out;
        }
    </style>
</head>
<body>

    <div class="svg-container">
        
        <!-- 音乐控制按钮 -->
        <div class="music-btn" id="music-btn" title="播放/暂停背景音乐">🎵</div>

        <!-- SVG 动画代码 -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
            <!-- 背景底色 (柔和的浅色) -->
            <rect width="400" height="400" fill="#f1faee" />

            <!-- 右侧的红色靠垫 -->
            <path d="M 220 150 Q 400 100 400 400 L 220 400 Z" fill="#e63946" opacity="0.9"/>

            <!-- 左下角的黄色衣服 (带呼吸动画) -->
            <g class="chest">
                <path d="M 0 400 L 0 240 Q 120 200 280 400 Z" fill="#e9c46a"/>
                <!-- 衣服上的小褶皱 -->
                <path d="M 50 280 Q 100 320 80 400" fill="none" stroke="#d4af37" stroke-width="4" stroke-linecap="round"/>
                <path d="M 120 300 Q 180 350 160 400" fill="none" stroke="#d4af37" stroke-width="4" stroke-linecap="round"/>
            </g>

            <!-- 宝宝的头部 -->
            <g>
                <!-- 圆润的脸蛋 -->
                <ellipse cx="200" cy="210" rx="115" ry="105" fill="#fcd5ce"/>
                
                <!-- 脸颊红晕 -->
                <ellipse cx="130" cy="240" rx="15" ry="10" fill="#ffb5a7" opacity="0.6"/>
                <ellipse cx="270" cy="240" rx="15" ry="10" fill="#ffb5a7" opacity="0.6"/>

                <!-- 稀疏的胎发 -->
                <path d="M 150 110 Q 200 90 250 110" fill="none" stroke="#4a4e69" stroke-width="2" stroke-linecap="round"/>
                <path d="M 170 100 Q 200 85 230 100" fill="none" stroke="#4a4e69" stroke-width="2" stroke-linecap="round"/>

                <!-- 闭着的眼睛 -->
                <path d="M 130 200 Q 155 215 180 200" fill="none" stroke="#4a4e69" stroke-width="4" stroke-linecap="round"/>
                <!-- 睫毛 -->
                <path d="M 140 206 L 135 212 M 155 210 L 155 216 M 170 206 L 175 212" fill="none" stroke="#4a4e69" stroke-width="2" stroke-linecap="round"/>
                
                <path d="M 220 200 Q 245 215 270 200" fill="none" stroke="#4a4e69" stroke-width="4" stroke-linecap="round"/>
                <!-- 睫毛 -->
                <path d="M 230 206 L 225 212 M 245 210 L 245 216 M 260 206 L 265 212" fill="none" stroke="#4a4e69" stroke-width="2" stroke-linecap="round"/>

                <!-- 小巧的鼻子 -->
                <path d="M 195 240 Q 200 245 205 240" fill="none" stroke="#e0afa0" stroke-width="3" stroke-linecap="round"/>

                <!-- 肉嘟嘟的小嘴巴 -->
                <path d="M 185 270 Q 200 280 215 270 Q 200 285 185 270" fill="#f28482"/>
                <path d="M 190 270 Q 200 265 210 270" fill="none" stroke="#e56b6f" stroke-width="2" stroke-linecap="round"/>
            </g>

            <!-- 飘动的 Zzz 动画 -->
            <text x="100" y="140" class="zzz z1" font-size="24">Z</text>
            <text x="70" y="100" class="zzz z2" font-size="32">Z</text>
            <text x="30" y="50" class="zzz z3" font-size="44">Z</text>
        </svg>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const musicBtn = document.getElementById('music-btn');
            
            // 创建背景音乐对象，指定同目录下的 lullaby.mp3
            const bgMusic = new Audio('lullaby.mp3');
            // 设置循环播放
            bgMusic.loop = true;
            
            // 【新增】将音量设置为 30%，你可以修改这个数值 (0.0 到 1.0)
            bgMusic.volume = 0.3; 
            
            let isPlaying = false;

            // 播放音乐的公共方法
            const playMusic = () => {
                if (isPlaying) return;
                bgMusic.play().then(() => {
                    musicBtn.classList.add('playing');
                    isPlaying = true;
                }).catch(e => {
                    console.log('浏览器限制了声音的自动播放，或者找不到音频文件。');
                });
            };

            // 1. 页面加载后立即尝试自动播放
            playMusic();

            // 2. 【新增的小魔法】如果浏览器拦截了自动播放，只要用户点击或触摸屏幕任何地方，立刻播放
            document.body.addEventListener('click', () => {
                if (!isPlaying) playMusic();
            }, { once: true }); // once: true 保证这个事件只触发一次
            
            document.body.addEventListener('touchstart', () => {
                if (!isPlaying) playMusic();
            }, { once: true });

            // 音乐按钮自己的点击逻辑 (播放/暂停切换)
            musicBtn.addEventListener('click', (e) => {
                e.stopPropagation(); // 防止点击按钮时触发上面的 body 点击事件
                
                if (isPlaying) {
                    // 暂停音乐
                    bgMusic.pause();
                    musicBtn.classList.remove('playing');
                    isPlaying = false;
                } else {
                    // 播放音乐
                    bgMusic.play().then(() => {
                        musicBtn.classList.add('playing');
                        isPlaying = true;
                    }).catch(e => {
                        alert('找不到音频文件！\n请确保你把 "lullaby.mp3" 和这个网页放在了同一个文件夹里。');
                    });
                }
            });
        });
    </script>
</body>
</html>
